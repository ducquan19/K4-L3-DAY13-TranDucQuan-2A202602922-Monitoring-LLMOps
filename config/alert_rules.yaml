alerts:
  - name: latency_p95_degraded
    severity: P2-warning
    condition: 'percentile(latency_ms, 95) over 5m > 2000 where event == "response_sent"'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-llmops-alerts'
    owner: Tran Duc Quan (on-call)
    runbook: docs/alerts.md#alert-1
  - name: error_rate_high
    severity: P1-critical
    condition: 'count(event == "request_failed") / count(event == "request_received") * 100 over 5m > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-llmops-alerts'
    owner: Tran Duc Quan (on-call)
    runbook: docs/alerts.md#alert-2
  - name: cost_burn_high
    severity: P2-warning
    condition: 'sum(cost_usd) over 1h * 24 > 2.5 where event == "response_sent"'
    duration: 15m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-llmops-alerts'
    owner: Tran Duc Quan (on-call)
    runbook: docs/alerts.md#alert-3
