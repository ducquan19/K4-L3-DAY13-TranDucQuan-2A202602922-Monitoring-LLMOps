service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  # Error budget = 0.5% request được phép lỗi hoặc chậm hơn 3000 ms trong 28 ngày.
  # Ở workload lab ~2.4 request/phút: 2.4 * 60 * 24 * 28 ≈ 96,768 request → budget ≈ 484 request xấu.
  # Burn rate = tỉ lệ request xấu / 0.5%; burn rate 14.4 kéo dài 1 giờ tiêu hết 2% budget 28 ngày.
  note: >-
    Giữ ngưỡng 3000 ms theo dashboard contract. Baseline đo ngày 2026-09-29 (44 request bình thường):
    P50 152 ms, P95 1221 ms, P99 2089 ms (P99 cao do lần fetch prompt đầu tiên sau khi khởi động),
    nên 3000 ms có headroom ~2.5x so với P95 và không cảnh báo giả khi cold start. Target 99.5% thay vì
    99.9% vì Langfuse prompt fetch và retrieval là dependency ngoài có timeout 2 s. rag_slow đẩy latency
    lên ~2650 ms, vẫn trong SLO nhưng gấp đôi P95 bình thường; alert latency_p95_degraded (2000 ms)
    trong alert_rules.yaml dùng để bắt sớm suy giảm này trước khi đốt error budget.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
